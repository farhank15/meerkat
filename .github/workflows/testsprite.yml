name: TestSprite (JUnit fallback)

# ─────────────────────────────────────────────────────────────────────────────
# STATUS: fallback path. Disabled until TESTSPRITE_PROJECT_ID is set.
#
# Season 4's primary path is the TestSprite **GitHub App** — it needs no repo
# changes and posts its own `testsprite-dev` comment on every pull request. The
# App does not document a JUnit report or any downloadable artifact, so
# Meerkat's preferred ingest is the TestSprite CLI reading the App's runs
# (`test list`, `test result --history --source github_action`, `test steps`),
# which keeps the suite at one run per PR.
#
# This workflow is the fallback: it runs the suite a second time purely to
# obtain `testsprite-junit.xml` for the offline/deterministic ingest path.
# Running both paths doubles TestSprite credit spend per PR, so enable it only
# if the CLI turns out not to see App-triggered runs for this project.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. The remediation job added later (F20) declares
# `contents: write` + `pull-requests: write` on its own job, not here.
permissions:
  contents: read

concurrency:
  group: testsprite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Named `testsprite-junit` so it is never confused with the GitHub App's own
    # `testsprite-dev` PR comment. This check exists only to produce the JUnit
    # artifact for Meerkat in the fallback path.
    name: testsprite-junit
    runs-on: ubuntu-latest
    # Runs once the TestSprite project is wired up (set the repository variable
    # TESTSPRITE_PROJECT_ID). Fork PRs never receive secrets, so they are skipped
    # rather than failed — this is the guard recommended by testsprite-action.
    if: ${{ vars.TESTSPRITE_PROJECT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4

      # The suite runs against the deployed app, not localhost. Per-PR runs are
      # resolved by the App's PR-trigger URL pattern ({branch-slug} etc.), not by
      # `target-url` (which the CLI rejects on full-project runs).
      - name: Run TestSprite suite
        id: testsprite
        uses: TestSprite/testsprite-action@v1
        with:
          api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          project: ${{ vars.TESTSPRITE_PROJECT_ID }}
          report-file: testsprite-junit.xml
          artifact-name: testsprite-junit
          timeout: '900'
          # Frontend tests on the V2 execution path may be reported as skipped;
          # flip to 'true' only if we deliberately accept partial runs.
          allow-partial: 'false'

      - name: Run summary
        if: always()
        run: |
          {
            echo "### TestSprite verdict"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| total | ${{ steps.testsprite.outputs.total }} |"
            echo "| passed | ${{ steps.testsprite.outputs.passed }} |"
            echo "| failed | ${{ steps.testsprite.outputs.failed }} |"
            echo "| skipped | ${{ steps.testsprite.outputs.skipped }} |"
            echo "| timed-out | ${{ steps.testsprite.outputs.timed-out }} |"
            echo "| error-code | \`${{ steps.testsprite.outputs.error-code }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # TODO (PR #3/#4): the `SuiteVitals Ratchet` job — reads the
      # `testsprite-junit` artifact, scores it against SPEC.md, and fails the
      # check when the score drops below the baseline on main.
      #
      # TODO (PR #6): the remediation job (F20) — gated on the verdict-trust
      # signal above. `error-code` non-empty or `timed-out > 0` means the run
      # never reached a trustworthy verdict, so the loop must stay silent
      # instead of dispatching an agent.
